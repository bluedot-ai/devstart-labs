apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: customer-tracker
  labels:
    app.kubernetes.io/name: customer-issue-tracker
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: customer-issue-tracker
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: customer-tracker
  labels:
    app.kubernetes.io/name: customer-issue-tracker
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-issue-tracker
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customer-issue-tracker
        app.kubernetes.io/component: backend
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker
      containers:
        - name: backend
          image: docker.io/library/customer-issue-tracker-backend:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: customer-tracker-config
          env:
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: customer-tracker-config
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: customer-tracker-secrets
                  key: MYSQL_PASSWORD
            - name: INITIAL_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: customer-tracker-secrets
                  key: INITIAL_ADMIN_USERNAME
            - name: INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: customer-tracker-secrets
                  key: INITIAL_ADMIN_PASSWORD
          startupProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /api/actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
