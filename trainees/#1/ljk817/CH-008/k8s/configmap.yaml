apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-tracker-config
  namespace: customer-tracker
data:
  MYSQL_DATABASE: customer_tracker
  MYSQL_USER: tracker
  DB_URL: jdbc:mysql://mysql:3306/customer_tracker?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  SESSION_COOKIE_SECURE: "false"
  TZ: Asia/Shanghai
