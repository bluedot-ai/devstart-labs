apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: customer-tracker
  labels:
    app.kubernetes.io/name: customer-issue-tracker
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: customer-issue-tracker
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: customer-tracker
  labels:
    app.kubernetes.io/name: customer-issue-tracker
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-issue-tracker
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customer-issue-tracker
        app.kubernetes.io/component: frontend
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker
      containers:
        - name: frontend
          image: docker.io/library/customer-issue-tracker-frontend:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
